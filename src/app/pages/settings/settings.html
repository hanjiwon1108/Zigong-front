<header class="page-header animate-fade-in">
  <h1>개인정보 설정</h1>
  <p class="subtitle">계정 정보와 보안을 관리합니다.</p>
</header>

@if (user) {
  <div class="animate-fade-in-up">
    <section class="profile-card" aria-label="사용자 정보">
      <div class="avatar" aria-hidden="true">{{ user.name[0] }}</div>
      <div class="profile-meta">
        <span class="profile-name">{{ user.name }}님</span>
        <span class="profile-sub">{{ user.email }}</span>
      </div>
      <div class="profile-amount">
        <span class="amount-label">총 자산</span>
        <strong>{{ user.total_assets | number }}원</strong>
      </div>
    </section>

    <section class="settings-card" aria-label="개인정보 수정">
      <div class="setting-block">
        <label class="setting-label" for="settingName">이름</label>
        <div class="setting-input">
          <input id="settingName" type="text" [value]="user.name" (input)="onNameInput($any($event.target).value)" />
        </div>
      </div>
      <div class="setting-block">
        <label class="setting-label" for="settingEmail">이메일</label>
        <div class="setting-input">
          <input id="settingEmail" type="email" [value]="user.email" (input)="onEmailInput($any($event.target).value)" />
        </div>
      </div>
      <div class="setting-block">
        <label class="setting-label" for="settingIncome">월 수입</label>
        <div class="setting-input">
          <input id="settingIncome" type="number" inputmode="numeric" [value]="user.monthly_income" (input)="onMonthlyIncomeInput($any($event.target).value)" />
          <span class="unit">원</span>
        </div>
      </div>
      <div class="setting-block">
        <label class="setting-label" for="settingAssets">총 자산</label>
        <div class="setting-input">
          <input id="settingAssets" type="number" inputmode="numeric" [value]="user.total_assets" (input)="onTotalAssetsInput($any($event.target).value)" />
          <span class="unit">원</span>
        </div>
      </div>
      <div class="setting-actions">
        <button class="save-btn" type="button" [disabled]="loading" (click)="save()">
          {{ loading ? '저장 중...' : '저장하기' }}
        </button>
        @if (successMessage) {
          <span class="status success">{{ successMessage }}</span>
        }
        @if (errorMessage) {
          <span class="status error">{{ errorMessage }}</span>
        }
      </div>
    </section>

    <section class="settings-card" aria-label="계정 관리">
      <div class="setting-row">
        <div class="setting-info">
          <span class="setting-title">로그아웃</span>
          <span class="setting-desc">현재 계정에서 안전하게 로그아웃합니다.</span>
        </div>
        <button class="logout-btn" type="button" (click)="logout()">로그아웃</button>
      </div>
    </section>
  </div>
}
