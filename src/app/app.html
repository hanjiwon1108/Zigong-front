@if (router.url !== '/auth') {
  <nav class="top-nav" aria-label="메인 내비게이션">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M16 4 L26 14 L16 28 L6 14 Z" fill="url(#navBrandGrad)" opacity="0.9"/>
        <path d="M16 4 L26 14 L16 17 L6 14 Z" fill="white" opacity="0.2"/>
        <path d="M11 18 L16 11 L21 18" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M16 11 L16 22" stroke="white" stroke-width="2.4" stroke-linecap="round"/>
        <defs>
          <linearGradient id="navBrandGrad" x1="6" y1="4" x2="26" y2="28" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#7AB3FF"/>
            <stop offset="50%" stop-color="#A855F7"/>
            <stop offset="100%" stop-color="#2DD4BF"/>
          </linearGradient>
        </defs>
      </svg>
      자공
    </div>
    <div class="nav-links">
      <a routerLink="/dashboard" routerLinkActive="active">홈</a>
      <a routerLink="/analytics" routerLinkActive="active">분석</a>
      <a routerLink="/transactions" routerLinkActive="active">내역</a>
      <a routerLink="/simulator" routerLinkActive="active">시뮬레이터</a>
      <a routerLink="/settings" routerLinkActive="active">설정</a>
    </div>
    <div class="nav-actions">
      @if (router.url !== '/settings') {
        <button
          class="help-btn"
          (click)="helpTour.startForCurrentRoute()"
          aria-label="현재 페이지 도움말 보기"
        >
          <span aria-hidden="true">?</span>
        </button>
      }
      <button
        class="theme-btn"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? '라이트 모드로 전환' : '다크 모드로 전환'"
      >
        @if (theme.theme() === 'dark') {
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
        } @else {
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        }
      </button>
    </div>
  </nav>
}

<main class="content" [class.auth]="router.url === '/auth'">
  <router-outlet />
</main>

@if (router.url !== '/auth') {
  @if (router.url !== '/settings') {
    <button
      class="mobile-help-btn"
      (click)="helpTour.startForCurrentRoute()"
      aria-label="현재 페이지 도움말 보기"
    >
      <span aria-hidden="true">?</span>
    </button>
  }
  <widget-bottom-nav />
}
<app-help-tour-overlay />
